name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - if: matrix.package == 'frontend'
        run: npm ci --prefix ../backend
      - if: matrix.package == 'frontend'
        run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
  production-role:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: buymore_production_role_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buymore_production_role_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Type-check production role test
        run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext test/production-role.test.ts
      - name: Test real PostgreSQL production grants
        run: npx tsx --test test/production-role.test.ts
        env:
          TEST_POSTGRES_URL: postgres://postgres:ci-only-password@localhost:5432/buymore_production_role_test
