services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: buymore
      POSTGRES_USER: buymore_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set owner password}
    volumes:
      - production_pg:/var/lib/postgresql/data
  api:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS origin}
      DATABASE_URL: ${DATABASE_URL:?Set runtime role URL}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
volumes:
  production_pg:
